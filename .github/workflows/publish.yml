name: Publish

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      modversion: ${{ steps.get_version.outputs.modversion }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: ./gradlew build

      - name: Get version
        id: get_version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "modversion=$MOD_VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}+${{ steps.get_version.outputs.modversion }}
          name: PoopSky-${{ github.ref_name }}-${{ steps.get_version.outputs.modversion }}
          generate_release_notes: true
          files: |
            build/libs/*.jar

  maven:
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Publish
        run: ./gradlew publish

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          destination_dir: ./repo

  bump:
    needs: [release]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          
      - name: Bump
        id: bump_version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ needs.release.outputs.modversion }}"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "newversion=$NEW_VERSION" >> $GITHUB_OUTPUT
          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION/" gradle.properties
          
      - name: Get bot token
        uses: actions/create-github-app-token@v3
        id: app_token
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

      - name: Setup Git
        run: |
          git config user.name "poopskymod-ci-bot[bot]"
          git config user.email "poopskymod-ci-bot[bot]@users.noreply.github.com"

      - name: Set git remote to use App token
        env:
          BOT_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git add gradle.properties
          git commit -m "chore: bump to next version ${{ steps.bump_version.outputs.newversion }}"
          git remote set-url origin https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

      - name: Push with App token
        run: git push origin ${{ github.ref_name }} --force

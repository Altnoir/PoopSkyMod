import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "1.17-SNAPSHOT"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base.archivesName = project.archive_name

repositories {
	flatDir {
		dirs "libs"
	}

	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}

	maven {
		url = "https://mvn.devos.one/snapshots/" // Create, Registrate, Milk Lib, Dripstone Fluid Lib
	}
	maven {
		url = "https://mvn.devos.one/releases/" // Porting Lib
	}
	maven {
		url = "https://maven.createmod.net/" // Flywheel, Ponder
	}
	maven {
		url = "https://maven.jamieswhiteshirt.com/libs-release" // Reach Entity Attributes
	}

	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	maven {
		url = "https://maven.twelveiterations.com/repository/maven-public/"

		content {
			includeGroup "net.blay09.mods"
		}
	}
	maven {
		name = "Greenhouse Maven"
		url = 'https://maven.greenhouse.lgbt/releases/'
	}
	maven {
		url = "https://maven.ryanhcode.dev/releases"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		url = "https://maven.blamejared.com" // JEI
	}

	maven {
		url = "https://maven.gnomecraft.net/releases/"
	}

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

fabricApi {
	configureDataGeneration {
		modId = project.mod_id
		client = true
	}
}

def LangReplacements = [
		'空中厕所'    : '空中卫生间',
		'大便失禁'    : '巧克力喷泉',
		'恶兆污秽'    : '悦动甜蜜',
		'马桶搋子'    : '魔女扫帚',
		'食粪者'      : '小谗鬼',
		'养粪人'      : '甜品师',
		'一切屎于脚下': '一切食于脚下',
		'屎溅之铃'    : '时间之铃',
		'屎'          : '巧克力',
		'粪水'        : '巧克力液',
		'化粪'        : '巧克力化',
		'挑粪匠'      : '高能饮品',
		'蛆块链'      : '曲块链',
		'蛔虫'        : '白巧克力棒',
		'苍蝇'        : '暗色蜜蜂',
		'厕所'        : '巧克力礼盒',
		'蛆'          : '牛奶巧克力',
		'粪便'        : '巧克力',
		'粪'          : '巧克力',
		'大便'        : '草莓塔',
		'蝇'          : '蜂',
		'忌讳'        : '甜蜜',
		'肛气'        : '氨气',
		'屁声'        : '排气声',
		'如厕'        : '出恭',
		'尿'          : '茶水'
]

def generateLang = tasks.register('generateLang') {
	group = 'data generation'
	description = 'Generates the built-in creator-friendly resource pack language file.'

	def sourceFile = layout.projectDirectory.file('src/main/resources/assets/poopsky/lang/zh_cn.json')
	def outputFile = layout.projectDirectory.file('src/main/resources/resourcepacks/poopsky_pack/assets/poopsky/lang/zh_cn.json')

	inputs.file sourceFile
	inputs.property 'replacements', LangReplacements.collect { source, replacement ->
		"${source}\u0000${replacement}"
	}
	outputs.file outputFile

	doLast {
		def sourcePath = sourceFile.asFile.toPath()
		def outputPath = outputFile.asFile.toPath()
		Files.createDirectories(outputPath.parent)
		Files.copy(sourcePath, outputPath, StandardCopyOption.REPLACE_EXISTING)

		def content = Files.readString(outputPath, StandardCharsets.UTF_8)
		if (content.startsWith('\uFEFF')) {
			content = content.substring(1)
		}
		LangReplacements.each { source, replacement ->
			content = content.replace(source, replacement)
		}
		Files.writeString(outputPath, content, StandardCharsets.UTF_8)
	}
}

tasks.named('runDatagen').configure {
	dependsOn generateLang
}

loom {
	accessWidenerPath = file("src/main/resources/poopsky.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.mappings_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modApi "com.terraformersmc:modmenu:11.0.2"

	modCompileOnly "com.google.code.findbugs:jsr305:3.0.2" // javax

	modImplementation(include("local:Registrate-MC1.21.1-1.3.99+ab9fdc3-fabric:1.0.0"))
	modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.configapi_version}")

	// JEI
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

	// Farmers Delight
	modImplementation("vectorwing:FarmersDelight:${project.farmersdelight_version}+refabricated") {
		exclude(group: "net.fabricmc")
	}

	// Touhou Little Maid
	modCompileOnly("maven.modrinth:touhoulittlemaid-orihime:${project.touhoulittlemaid_version}")

	include(modApi("dev.ryanhcode.sable-companion:sable-companion-fabric-${project.minecraft_version}:${project.sable_companion_version}"))
}

sourceSets.main.resources.setSrcDirs(["src/main/resources", "src/main/generated"])

processResources {
	dependsOn generateLang
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('sourcesJar').configure {
	dependsOn generateLang
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

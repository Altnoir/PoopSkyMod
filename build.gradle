    officialReplacements[key] = value[0]
    communityReplacements[key] = value[1]
}

def generateLang = tasks.register('generateLang') {
    group = 'data generation'

    def sourceFile = layout.projectDirectory.file('src/main/resources/assets/poopsky/lang/zh_cn.json')
    def officialOutput = layout.projectDirectory.file('src/main/resources/resourcepacks/poopsky_official_pack/assets/poopsky/lang/zh_cn.json')
    def communityOutput = layout.projectDirectory.file('src/main/resources/resourcepacks/poopsky_community_pack/assets/poopsky/lang/zh_cn.json')

    inputs.file sourceFile
    inputs.property 'officialReplacements', officialReplacements.collect { k, v -> "$k\u0000$v" }
    inputs.property 'communityReplacements', communityReplacements.collect { k, v -> "$k\u0000$v" }
    outputs.files officialOutput, communityOutput

    doLast {
        def sourceContent = Files.readString(sourceFile.asFile.toPath(), StandardCharsets.UTF_8)
        if (sourceContent.startsWith('\uFEFF')) {
            sourceContent = sourceContent.substring(1)
        }
        [[officialOutput, officialReplacements], [communityOutput, communityReplacements]].each { target ->
            def outputPath = target[0].asFile.toPath()
            Files.createDirectories(outputPath.parent)
            def content = sourceContent
            target[1].each { source, replacement -> content = content.replace(source, replacement) }
            Files.writeString(outputPath, content, StandardCharsets.UTF_8)
        }
    }
}

tasks.named('runClientData').configure {
    dependsOn generateLang
}

tasks.register('runData') {
    group = 'data generation'
    dependsOn tasks.named('runClientData')
}

tasks.named('processResources').configure {
    dependsOn generateLang
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}


import java.nio.charset.StandardCharsets
import java.nio.file.Files

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = "https://maven.ryanhcode.dev/releases" } // Sable
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.gegy.dev/releases" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI
    maven { url = "https://cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" } // Simple Bedrock Model
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientData {
            type = "clientData"
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def prepareBundledSbm = tasks.register('prepareBundledSbm', Jar) {
    archiveFileName = 'simplebedrockmodel-2.5.0-neoforge-mc26.1.jar'
    destinationDirectory = layout.buildDirectory.dir('generated/local-libs')
    from zipTree('libs/simplebedrockmodel-2.5.0-neoforge-mc26.1.jar')
    manifest {
        attributes 'Automatic-Module-Name': 'com.github.mcmodderanchor.simplebedrockmodel'
    }
}


        '大便失禁'    : ['秽壤潮涌', '巧克力喷泉'],
        '恶兆污秽'    : ['恶兆污秽', '悦动甜蜜'],
        '马桶搋子'    : ['污秽棍', '魔女扫帚'],
        '马桶制杖'    : ['污秽杖', '魔女法杖'],
        '食粪者'      : ['食粪者', '小谗鬼'],
        '养粪人'      : ['污秽者', '甜品师'],
        '一切屎于脚下': ['万物始于污秽', '一切食于脚下'],

        '粪水'        : ['秽壤液', '巧克力液'],
        '化粪'        : ['秽壤化', '巧克力化'],
        '挑粪匠'      : ['拾秽工', '高能饮品'],
        '蛆块链'      : ['蛆块链', '区块链'],
        '寄生虫'      : ['寄生虫', '花朵快快长'],
        '蛔虫'        : ['蛔虫', '白巧克力棒'],
        '苍蝇'        : ['秽壤飞蝇', '暗色蜜蜂'],
        '厕所'        : ['还元坑', '巧克力礼盒'],
        '马桶'        : ['化生龛', '葡萄酒杯'],
        '蛆'          : ['蛆', '牛奶巧克力'],
        '粪便'        : ['秽壤', '巧克力'],
        '粪'          : ['秽壤', '巧克力'],
        '大便'        : ['秽壤团', '草莓塔'],
        '蝇'          : ['蝇', '蜂'],
        '忌讳'        : ['忌讳', '甜蜜'],
        '肛气'        : ['肛气', '氨气'],
        '屁声'        : ['秽气声', '排气声'],
        '如厕'        : ['出恭', '出恭'],
        '尿'          : ['秽水', '茶水']
]
def officialReplacements = [:]
def communityReplacements = [:]
LangReplacements.each { key, value ->
    officialReplacements[key] = value[0]
    communityReplacements[key] = value[1]
}
def generateLang = tasks.register('generateLang') {
    group = 'data generation'

    def sourceFile = layout.projectDirectory.file('src/main/resources/assets/poopsky/lang/zh_cn.json')
    def officialOutput = layout.projectDirectory.file('src/main/resources/resourcepacks/poopsky_official_pack/assets/poopsky/lang/zh_cn.json')
    def communityOutput = layout.projectDirectory.file('src/main/resources/resourcepacks/poopsky_community_pack/assets/poopsky/lang/zh_cn.json')

    inputs.file sourceFile
    inputs.property 'officialReplacements', officialReplacements.collect { k, v -> "$k\u0000$v" }
    inputs.property 'communityReplacements', communityReplacements.collect { k, v -> "$k\u0000$v" }
    outputs.file officialOutput
    outputs.file communityOutput

    doLast {
        // 读取源文件并去除 BOM
        def sourceContent = Files.readString(sourceFile.asFile.toPath(), StandardCharsets.UTF_8)
        if (sourceContent.startsWith('\uFEFF')) {
            sourceContent = sourceContent.substring(1)
        }

        // 官方版
        def officialPath = officialOutput.asFile.toPath()
        Files.createDirectories(officialPath.parent)
        def officialContent = sourceContent
        officialReplacements.each { src, repl ->
            officialContent = officialContent.replace(src, repl)
        }
        Files.writeString(officialPath, officialContent, StandardCharsets.UTF_8)

        // 社区版
        def communityPath = communityOutput.asFile.toPath()
        Files.createDirectories(communityPath.parent)
        def communityContent = sourceContent
        communityReplacements.each { src, repl ->
            communityContent = communityContent.replace(src, repl)
        }
        Files.writeString(communityPath, communityContent, StandardCharsets.UTF_8)
    }
}

tasks.named('runData').configure {
    dependsOn generateLang
}

tasks.named('processResources').configure {
    dependsOn generateLang
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // Patchouli
    compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    // Touhou Little Maid
    implementation "curse.maven:touhou-little-maid-355044:7307724"
    compileOnly files("libs/touhou_little_mad-0.1.2-alpha.jar")
    // Create
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation jarJar("com.tterrag.registrate:Registrate:${registrate_version}")
    // Simple Bedrock Model
    implementation jarJar("com.github.mcmodderanchor:simplebedrockmodel:$sbm_version-neoforge-mc1.21.1") {
        version {
            prefer "$sbm_version"
        }
    }
    compileOnly("com.maydaymemory:mae:$mae_version") {
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }

    // Farmers Delight
    compileOnly("curse.maven:farmers-delight-398521:${farmersdelight_version}")
    localRuntime("curse.maven:farmers-delight-398521:${farmersdelight_version}")
    // KubeJS (compileOnly - compat removed, keep for future use)
    compileOnly("dev.latvian.mods:kubejs-neoforge:$kubejs_version")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            jei_version_range      : jei_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = file("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

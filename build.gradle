plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)'; id 'org.spongepowered.mixin' version '0.7-SNAPSHOT' }
version = '2.2+Forge1.20.1-Hotfix2'
group = 'com.altnoir.poopsky'
base { archivesName = 'poopsky' }
def releaseVersion = providers.provider { project.version.toString().replaceFirst(/-r\d+$/, '') }
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    archiveFileName = provider {
        def classifier = archiveClassifier.getOrElse('')
        "poopsky ${releaseVersion.get()}${classifier ? '-' + classifier : ''}.${archiveExtension.get()}"
    }
}
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven {
        url = 'https://maven.tterrag.com'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods'; includeGroup 'dev.latvian.apps' }
    }
    maven {
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.mcmodderanchor'; includeGroup 'com.maydaymemory' }
    }
    mavenCentral()
}
jarJar.enable()
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    // 使用固定发布 ID，保持与此前编译依赖的文件版本一致。
    compileOnly fg.deobf('maven.modrinth:farmers-delight:SiIpcZzM') // 1.20.1-1.3.4
    compileOnly fg.deobf('maven.modrinth:touhou-little-maid:g1SKoGQJ') // 1.5.3-forge+mc1.20.1
    compileOnly fg.deobf('maven.modrinth:create:8amzvn9x') // 1.20.1-6.0.8
    compileOnly fg.deobf('maven.modrinth:patchouli:94dtOLgZ') // 1.20.1-85-FORGE
    implementation fg.deobf('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
    compileOnly fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    compileOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5')
    implementation fg.deobf('io.github.llamalad7:mixinextras-forge:0.4.1')
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    implementation fg.deobf('com.github.mcmodderanchor:simplebedrockmodel:2.5.1-forge-mc1.20.1')
    compileOnly('com.maydaymemory:mae:1.1.4') { transitive = false }
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.74.0.234')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.74.0.234')
    compileOnly fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.26')
    compileOnly fg.deobf('dev.latvian.mods:rhino-forge:2001.2.2-build.1')
    compileOnly fg.deobf('dev.architectury:architectury-forge:9.1.12')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    jarJar(group: 'com.tterrag.registrate', name: 'Registrate', version: '[MC1.20-1.3.3,)') { jarJar.pin(it, 'MC1.20-1.3.3') }
    jarJar(group: 'io.github.llamalad7', name: 'mixinextras-forge', version: '[0.4.1,)') { jarJar.pin(it, '0.4.1') }
    jarJar(group: 'com.github.mcmodderanchor', name: 'simplebedrockmodel', version: '[2.5.1-forge-mc1.20.1,)') { jarJar.pin(it, '2.5.1-forge-mc1.20.1'); transitive = false }
}
mixin {
    add sourceSets.main, 'poopsky.refmap.json'
    config 'poopsky.mixins.json'
}
tasks.named('jarJar') {
    archiveClassifier = ''
    from('LICENSE-CODE', 'LICENSE-ASSETS')
}
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
processResources {
    def props = [mod_id: 'poopsky', mod_name: 'PoopSky', mod_version: releaseVersion.get(),
                 minecraft_version: '1.20.1', forge_version: '47.4.0']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar {
    manifest { attributes 'MixinConfigs': 'poopsky.mixins.json' }
    from('LICENSE-CODE', 'LICENSE-ASSETS')
}
jar.finalizedBy('reobfJar')
